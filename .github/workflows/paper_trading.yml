name: Daily Paper Trading Production Run

on:
  schedule:
    # Runs at 10:30 UTC every Monday through Friday
    # 10:30 UTC is exactly 16:00 IST (Indian Standard Time)
    - cron: '30 10 * * 1-5'
  workflow_dispatch: # Allows manual triggering from GitHub UI

jobs:
  run-paper-trading:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy statsmodels yfinance
          
      - name: Run Market Data Updater and Trading Engine
        run: |
          python run_paper_trading.py
          
      - name: Commit Updated Database
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/paper_trading.db
          # Only commit if there are changes
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update paper trading database" && git push)
